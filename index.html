<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT 阵容推荐</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> 

        <div class="lineup-controls-and-display">
            <button id="toggle-all-lineups-button">阵容</button>
            <div id="selected-lineup-container">
                <!-- 默认选中的阵容将在这里显示 -->
            </div>
        </div>

        <div id="all-lineups-scroll-container" class="hidden">
            <!-- 所有阵容的完整卡片将在这里列出 -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
